services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DB_SRC=postgresql+asyncpg://postgres:123@db:5432/products_service
    depends_on:
      - db

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: products_service
    volumes:
      - db_data:/var/lib/postgresql/data
  
volumes:
  db_data: